[project]
name = "since-backend"
version = "0.1.0"
description = "Since project backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "firebase-admin>=7.5.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "resend>=2.36.0",
    "sqlalchemy>=2.0.52",
    "websockets>=17.0.1",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.vercel]
entrypoint = "main:app"
